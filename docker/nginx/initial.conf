# Bootstrap do primeiro deploy: apenas HTTP, sem bloco SSL.
# Permite o Nginx subir antes de existir certificado, para o certbot validar o domínio.
# Copiado para active.conf por `make deploy-first`; depois trocado por production.conf.
server {
    listen 80;
    server_name ${APP_DOMAIN};

    root /var/www/html/public;
    index index.php;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
