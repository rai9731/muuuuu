; Desenvolvimento: valida timestamps para que alterações em PHP sejam recarregadas.
; revalidate_freq=0 fazia o PHP checar milhares de arquivos a cada requisição, o que é
; muito lento em bind mount do Windows; 2s mantém o reload e elimina o custo.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 256
realpath_cache_size = 4096K
realpath_cache_ttl = 600
